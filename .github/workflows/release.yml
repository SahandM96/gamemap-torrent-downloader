name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch aria2 sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p sidecars
          curl -fsSL -o sidecars/aria2c \
            https://github.com/abcfy2/aria2-static-build/releases/download/1.37.0/aria2c-x86_64-linux-musl
          chmod +x sidecars/aria2c
          sha256sum sidecars/aria2c | tee sidecars/aria2c.sha256
          bash sidecars/prepare-tauri-external.sh

      - name: Fetch aria2 sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p sidecars
          curl -fsSL -o aria2-win.zip \
            https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip
          unzip -j aria2-win.zip aria2-1.37.0-win-64bit-build1/aria2c.exe -d sidecars
          bash sidecars/prepare-tauri-external.sh

      - name: Fetch aria2 sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p sidecars
          curl -fsSL -o aria2-mac.zip \
            https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-osx-darwin.tar.bz2
          tar -xjf aria2-mac.zip
          cp aria2-1.37.0-osx-darwin/bin/aria2c sidecars/aria2c
          chmod +x sidecars/aria2c
          bash sidecars/prepare-tauri-external.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GameMap Torrent Desk ${{ github.ref_name }}
          releaseBody: |
            Builds include aria2c 1.37.0 as a sidecar (GPL-2+). See NOTICE in the repo.
            Donations: DONATE.md
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
